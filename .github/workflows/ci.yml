# Runs the tests and the code check on every push and pull request.
# Tests that need the supplied index files (not in the repo) are skipped automatically.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m pytest -q
